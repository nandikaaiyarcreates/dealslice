.eyebrow { color: #101828; }
.task-bar input { border-color: var(--field-line); background: var(--field-bg); color: var(--ink); }
.error-banner { background: var(--err-bg); color: var(--err-ink); }
.dropzone { border-color: var(--drop-line); background: var(--drop-bg); }
.change-file-button { border-color: var(--change-line); }
.change-file-button:hover { background: var(--change-hover); }
.remove-file-button { border-color: var(--remove-line); background: var(--remove-bg); color: var(--remove-ink); }
.remove-file-button:hover { border-color: var(--remove-ink); background: var(--remove-hover); }
.sample-button { background: var(--sample-bg); }
.preset { background: var(--chip-bg); }
.hq-filter { border-color: var(--hq-line); }
.hq-filter-heading span, .hq-filter small { color: var(--hq-muted); }
.hq-filter-buttons button { border-color: var(--hq-btn-line); background: var(--hq-btn-bg); color: var(--hq-btn-ink); }
.hq-filter-buttons button span { color: var(--hq-count); }
.hq-filter-buttons button.active span { color: #e9e4ff; }
